<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Opportunities — OpportunityHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <a href="dashboard.html" class="brand">
                <span class="brand-mark">O</span>
                <span>OpportunityHub</span>
            </a>
            <nav class="topbar-nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="opportunities.html" class="active">Discover</a>
                <a href="saved.html">Saved</a>
                <a href="applications.html">Applications</a>
            </nav>
            <button id="logoutButton" class="btn btn-secondary small" type="button">Logout</button>
        </header>

        <main class="page-container">
            <section class="content-panel">
                <div class="section-header">
                    <h2>Discover opportunities</h2>
                </div>

                <div class="filters">
                    <input id="searchInput" type="search" placeholder="Search by title or organization" aria-label="Search opportunities">
                    <select id="categoryFilter" aria-label="Filter by category">
                        <option value="">All categories</option>
                        <option value="Hackathons">Hackathons</option>
                        <option value="Internships">Internships</option>
                        <option value="Scholarships">Scholarships</option>
                        <option value="Bootcamp">Bootcamp</option>
                        <option value="Events">Events</option>
                    </select>
                    <select id="modeFilter" aria-label="Filter by mode">
                        <option value="">Any mode</option>
                        <option value="online">Online</option>
                        <option value="offline">Offline</option>
                        <option value="hybrid">Hybrid</option>
                    </select>
                </div>

                <div id="opportunitiesResults" class="list-grid"></div>
                <div id="emptyState" class="empty-state" hidden>No matching opportunities found.</div>
            </section>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/opportunities.js"></script>
</body>
</html>
