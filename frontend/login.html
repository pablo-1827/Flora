<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Log in — OpportunityHub</title>

    <meta
        name="description"
        content="Log in to your OpportunityHub account and discover opportunities matched to you."
    >

    <!-- Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- OpportunityHub styles -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>

<body>

<main class="auth-page">

    <!-- Decorative background -->
    <div class="auth-glow auth-glow--one"></div>
    <div class="auth-glow auth-glow--two"></div>


    <section class="auth-shell">

        <!-- Brand -->
        <a
            href="index.html"
            class="auth-brand"
            aria-label="OpportunityHub home"
        >
            <span class="brand-mark">O</span>
            <span>OpportunityHub</span>
        </a>


        <!-- Login Card -->
        <div class="auth-card">

            <!-- Header -->
            <div class="auth-header">

                <span class="auth-eyebrow">
                    WELCOME BACK
                </span>

                <h1>
                    Good to see you again.
                </h1>

                <p>
                    Log in to discover opportunities
                    that fit your goals.
                </p>

            </div>


            <!-- Login Form -->
            <form
                class="auth-form"
                id="loginForm"
            >

                <!-- Email -->
                <div class="form-field">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-field">

                    <div class="form-label-row">

                        <label for="password">
                            Password
                        </label>

                        <a
                            href="#"
                            class="forgot-link"
                            id="forgotPassword"
                        >
                            Forgot password?
                        </a>

                    </div>


                    <div class="password-field">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                        >
                            <span id="passwordToggleText">
                                Show
                            </span>
                        </button>

                    </div>

                </div>


                <!-- Remember Me -->
                <label class="remember-option">

                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                    >

                    <span class="custom-checkbox"></span>

                    <span>
                        Keep me logged in
                    </span>

                </label>


                <!-- Status / Error -->
                <div
                    class="auth-message"
                    id="authMessage"
                    role="alert"
                    aria-live="polite"
                ></div>


                <!-- Submit -->
                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                    id="loginButton"
                >

                    <span id="loginButtonText">
                        Log in
                    </span>

                    <span
                        class="button-arrow"
                        aria-hidden="true"
                    >
                        →
                    </span>

                </button>

            </form>


            <!-- Divider -->
            <div class="auth-divider">
                <span>or</span>
            </div>


            <!-- Register -->
            <div class="auth-register">

                <span>
                    Don't have an account?
                </span>

                <a href="register.html">
                    Create one
                </a>

            </div>

        </div>


        <!-- Footer -->
        <div class="auth-footer">

            <a href="index.html">
                ← Back to OpportunityHub
            </a>

        </div>

    </section>

</main>

<script src="js/api.js"></script>
<script src="js/login.js"></script>

</body>
</html>
